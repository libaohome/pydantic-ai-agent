[project]
name = "pydantic-ai-agent"
version = "0.1.0"
description = "Production-grade AI Agent built with Pydantic AI"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10,<3",
    "pydantic-ai>=1.0,<2",
    "pydantic-ai-slim[openai,anthropic,google,ollama,mcp]>=1.0,<2",
    "pydantic-ai-skills>=0.1,<1",
    "pydantic-graph>=1.0,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "sqlalchemy>=2.0,<3",
    "greenlet>=3.0,<4",
    "aiosqlite>=0.21,<1",
    "logfire[fastapi,httpx]>=3.0,<4",
    "python-dotenv>=1.0,<2",
    "tenacity>=9.0,<10",
    "python-multipart>=0.0.18,<1",
    "pillow>=10.0,<12",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
]
persistence = [
    "temporalio>=1.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pyright]
pythonVersion = "3.12"
include = ["app", "tests", "scripts"]
extraPaths = ["."]
venvPath = "/opt/miniconda3/envs"
venv = "py312"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "docker*", "mcp_servers*", "scripts*"]
